name: test

# Manual only: this account's GitHub Actions minutes are blocked by a billing
# issue, so a push trigger would paint every commit red for reasons unrelated to
# the code. Run it by hand (Actions → test → Run workflow) once billing is clear,
# or flip `on:` to `push`/`pull_request` then.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests (offline, no credentials)
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Desktop half parses as ESM
        run: node --input-type=module --check < desktop/plugin.js

      - name: Manifests parse
        run: |
          python -c "import json; json.load(open('dashboard/manifest.json'))"
          python -c "import yaml; yaml.safe_load(open('plugin.yaml'))"
